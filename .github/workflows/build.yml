name: Build

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 4 * * *"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      # A failing image must not cancel the others
      fail-fast: false
      matrix:
        include:
          - name: "TYPO3 v14 (PHP 8.4)"
            version: v14
            options: --php 8.4 --php-tag --keep-plain-tags
          - name: "TYPO3 v14 (PHP 8.5)"
            version: v14
            options: --php 8.5 --php-tag
          - name: "TYPO3 v13"
            version: v13
            options: --php 8.3
          - name: "TYPO3 v12"
            version: v12
    steps:
      -
        name: Checkout code
        uses: actions/checkout@v3
      -
        name: Install composer
        uses: php-actions/composer@v6
        with:
          php_version: "8.3"
      -
        name: Docker info
        run: docker info
      -
        name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v2
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
        with:
          platforms: linux/amd64,linux/arm64
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      -
        name: Build and push image
        shell: 'script -q -e -c "bash {0}"'
        run: ./bin/t3-container build ochorocho/typo3-container ${{ matrix.version }} ${{ matrix.options }} --additional-image ghcr.io/ochorocho/typo3-container -x -p
