name: Test

on:
  push:
    branches:
      - '*'
      - '!main'
  pull_request:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      # Show the result for every image
      fail-fast: false
      matrix:
        include:
          - name: "TYPO3 dev-main"
            version: dev-main
          - name: "TYPO3 v14 (PHP 8.4)"
            version: v14
            options: --php 8.4 --php-tag
          - name: "TYPO3 v14 (PHP 8.5)"
            version: v14
            options: --php 8.5 --php-tag
          - name: "TYPO3 v13"
            version: v13
            options: --php 8.3
          - name: "TYPO3 v12"
            version: v12
    steps:
      -
        name: Checkout code
        uses: actions/checkout@v3
      -
        name: Install composer
        uses: php-actions/composer@v6
        with:
          php_version: "8.3"
      -
        name: Docker info
        run: docker info
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v2
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
        with:
          platforms: linux/amd64,linux/arm64
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      -
        name: Build image
        shell: 'script -q -e -c "bash {0}"'
        run: ./bin/t3-container build ochorocho/typo3-container ${{ matrix.version }} ${{ matrix.options }} -x
